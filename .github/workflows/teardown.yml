name: teardown

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.HW31_CI_ROLE_ARN }}
          aws-region: eu-central-1

      - name: install pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: destroy demo then base
        env:
          HW31_STATE_BUCKET: ${{ vars.HW31_STATE_BUCKET }}
          PULUMI_BACKEND_URL: s3://${{ vars.HW31_STATE_BUCKET }}
          PULUMI_CONFIG_PASSPHRASE: hw31-not-a-secret
          AWS_REGION: eu-central-1
        run: |
          set -euo pipefail
          if [ -z "${HW31_STATE_BUCKET:-}" ]; then
            echo "missing GitHub variable HW31_STATE_BUCKET" >&2
            exit 1
          fi
          mkdir -p evidence
          role_urn='urn:pulumi:base::hw31-base::aws:iam/role:Role::gha-teardown'
          policy_urn='urn:pulumi:base::hw31-base::aws:iam/rolePolicy:RolePolicy::gha-teardown'
          for which in demo base; do
            cd "$GITHUB_WORKSPACE/infra/$which"
            npm ci --no-audit --no-fund
            if err="$(pulumi stack select "$which" --non-interactive 2>&1)"; then
              # The committed yaml has no email, bucket or db password. CI has no
              # GitHub Secret for them. Fill only the keys this checkout cannot see.
              if ! pulumi config get hw31:stateBucket --non-interactive >/dev/null 2>&1; then
                pulumi config set hw31:stateBucket "$HW31_STATE_BUCKET" --non-interactive
              fi
              if [ "$which" = base ] && ! pulumi config get hw31:budgetEmail --non-interactive >/dev/null 2>&1; then
                pulumi config set hw31:budgetEmail "ci-destroy@example.com" --non-interactive
              fi
              if [ "$which" = demo ] && ! pulumi config get hw31:dbPassword --non-interactive >/dev/null 2>&1; then
                pulumi config set --secret hw31:dbPassword "unused-for-destroy" --non-interactive
              fi
              if [ "$which" = base ] && pulumi stack export | jq -e --arg urn "$role_urn" \
                '[.deployment.resources[].urn] | index($urn) != null' >/dev/null; then
                # Leave the CI role until the last step. Pulumi removes its policy
                # first, and the role then cannot delete itself.
                pulumi destroy --yes --non-interactive \
                  --exclude "$role_urn" --exclude "$policy_urn"
              else
                pulumi destroy --yes --non-interactive
              fi
              if [ "$which" != base ]; then
                pulumi stack export > "$GITHUB_WORKSPACE/evidence/${which}-state.json"
              fi
            elif printf '%s' "$err" | grep -q 'no stack named'; then
              echo '{"deployment":{"resources":[]}}' > "$GITHUB_WORKSPACE/evidence/${which}-state.json"
            else
              printf '%s\n' "$err" >&2
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
          done
          # Destroy skipped this role because Pulumi deletes its policy first and
          # then can no longer delete the role. Remove that state record and
          # delete the role itself. A failed DeleteRole stops the job, and the
          # role keeps its tags, so the emptiness check cannot call it zero.
          role_name=hw31-gha-teardown
          cd "$GITHUB_WORKSPACE/infra/base"
          if pulumi stack select base --non-interactive >/dev/null 2>&1; then
            if pulumi stack export | jq -e --arg urn "$policy_urn" \
              '[.deployment.resources[].urn] | index($urn) != null' >/dev/null; then
              pulumi state delete "$policy_urn" --yes --force
            fi
            if pulumi stack export | jq -e --arg urn "$role_urn" \
              '[.deployment.resources[].urn] | index($urn) != null' >/dev/null; then
              pulumi state delete "$role_urn" --yes --force
            fi
            pulumi stack export > "$GITHUB_WORKSPACE/evidence/base-state.json"
          fi
          cd "$GITHUB_WORKSPACE"
          if aws iam get-role --role-name "$role_name" >/dev/null 2>&1; then
            policies="$(aws iam list-role-policies --role-name "$role_name" --query 'PolicyNames[]' --output text)"
            attached="$(aws iam list-attached-role-policies --role-name "$role_name" --query 'AttachedPolicies[].PolicyArn' --output text)"
            profiles="$(aws iam list-instance-profiles-for-role --role-name "$role_name" --query 'InstanceProfiles[].InstanceProfileName' --output text)"
            for item in $profiles; do
              [ "$item" = None ] && continue
              aws iam remove-role-from-instance-profile --instance-profile-name "$item" --role-name "$role_name"
            done
            for item in $attached; do
              [ "$item" = None ] && continue
              aws iam detach-role-policy --role-name "$role_name" --policy-arn "$item"
            done
            for item in $policies; do
              [ "$item" = None ] && continue
              aws iam delete-role-policy --role-name "$role_name" --policy-name "$item"
            done
            aws iam delete-role --role-name "$role_name"
          fi

      - name: six emptiness checks
        run: bash scripts/hw31/empty-check.sh
