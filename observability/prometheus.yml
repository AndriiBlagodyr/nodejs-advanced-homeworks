global:
  scrape_interval: 1s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # The process writes this file after listen(), from METRICS_TARGET or
    # METRICS_TARGET_HOST plus the port it actually bound (port 0 for demos).
    file_sd_configs:
      - files:
          - /etc/prometheus/sd/targets.json
        refresh_interval: 1s
